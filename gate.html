<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100vh}
body{
  font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
  background:#0E1C36;color:#fff;
  background-image:linear-gradient(135deg,#0E1C36 0%,#1F3F73 50%,#0E1C36 100%),url('assets/photo-resort-crowd.webp');
  background-size:cover;background-position:center;background-blend-mode:overlay;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;
}
.gate{
  width:100%;max-width:440px;background:rgba(11,17,27,.78);
  backdrop-filter:saturate(150%) blur(20px);-webkit-backdrop-filter:saturate(150%) blur(20px);
  border:1px solid rgba(255,255,255,.12);border-radius:16px;
  padding:40px 36px;box-shadow:0 24px 60px rgba(0,0,0,.4);
}
.gate-logo{display:flex;justify-content:center;margin-bottom:24px}
.gate-logo svg{height:48px;width:auto}
.gate h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:26px;letter-spacing:-0.01em;margin:0 0 8px;text-align:center}
.gate p{margin:0 0 28px;color:rgba(255,255,255,.65);font-size:14px;line-height:1.6;text-align:center}
.gate em{font-family:'Instrument Serif',serif;font-style:italic;color:#DCEEF8}
.field{margin-bottom:16px}
.label{display:block;font-size:13px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:8px}
.input{
  width:100%;padding:14px 16px;font:inherit;font-size:16px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);
  color:#fff;border-radius:10px;outline:none;
  transition:border-color .15s,background .15s;
}
.input:focus{border-color:#8EC5E0;background:rgba(255,255,255,.1)}
.btn{
  width:100%;padding:14px;font:inherit;font-weight:600;font-size:15px;
  background:#E8A24A;color:#6B3A0E;border:0;border-radius:10px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:background .15s,transform .1s;
}
.btn:hover{background:#d8902d}
.btn:active{transform:scale(.98)}
.error{color:#F4B5AE;font-size:13px;margin-top:12px;text-align:center;min-height:18px}
.foot{margin-top:24px;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:rgba(255,255,255,.45);text-align:center}
</style>

  <h1>Preview <em>access</em></h1>
  <p>This site is in review. Enter the password shared with you to continue.</p>
  <div class="field">
    <label class="label" for="p">Password</label>
    <input class="input" id="p" type="password" autocomplete="off" autofocus required>
  </div>
  <button class="btn" type="submit">Enter site →</button>
  <div class="error" id="err"></div>
  <div class="foot">Mitre Ski Club · Member preview</div>
</form>
<script>
(function(){
  var EXPECTED='da6457aa6e04b71db24a5c12770d77c7f2ee7072a5f9a8b2191dcf9478726269';
  var form=document.getElementById('gate'),input=document.getElementById('p'),err=document.getElementById('err');
  function getReturn(){
    var p=new URLSearchParams(location.search).get('r');
    if(!p) return 'index.html';
    // sanitize: only allow same-origin .html paths
    if(/^[\w\-]+\.html$/.test(p)) return p;
    return 'index.html';
  }
  async function sha256(s){
    var b=new TextEncoder().encode(s);
    var h=await crypto.subtle.digest('SHA-256',b);
    return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
  }
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    err.textContent='';
    var hash=await sha256(input.value);
    if(hash===EXPECTED){
      try{localStorage.setItem('mpa',EXPECTED);}catch(_){}
      location.replace(getReturn());
    }else{
      err.textContent='Incorrect password. Try again.';
      input.select();
    }
  });
})();
</script>
